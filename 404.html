<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Not Found | Jinsoo Heo</title>
  <meta name="description" content="Page not found on koriel.kr. Return to Jinsoo Heo's homepage.">
  <link rel="canonical" href="https://koriel.kr/">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#04060c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#e8edf6" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">

  <script>
    (function(){
      try{
        var t = localStorage.getItem("theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      }catch(_){}
    })();
  </script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    :root{
      --base:#e8edf6;--blob-1:#5aa9ff;--blob-2:#a98bff;--blob-3:#ff92b8;--blob-4:#62e0c4;--blob-o:.8;
      --dots:rgba(31,35,40,.16);
      --glass:rgba(255,255,255,.5);--glass-solid:rgba(250,251,253,.95);
      --fill:rgba(255,255,255,.42);--fill-strong:rgba(255,255,255,.74);
      --stroke:rgba(255,255,255,.6);--hi:rgba(255,255,255,.95);
      --rim:rgba(255,255,255,.95);--rim-soft:rgba(255,255,255,.16);
      --sheen:rgba(255,255,255,.55);
      --shadow:0 32px 80px -24px rgba(24,39,84,.38),0 12px 32px -16px rgba(24,39,84,.22);
      --fg:#1f2328;--muted:#4f5864;--glass-tone:1.08;
      --green:#116329;--blue:#0550ae;--yellow:#7d4e00;--red:#a40e26;
      --dot-red:#ff5f57;--dot-yellow:#febc2e;--dot-green:#28c840;
      --radius:28px;
    }
    @media(prefers-color-scheme:dark){:root:not([data-theme=light]){
      --base:#04060c;--blob-1:#2563eb;--blob-2:#8b3cf7;--blob-3:#e0407f;--blob-4:#10b39b;--blob-o:.85;
      --dots:rgba(255,255,255,.11);
      --glass:rgba(13,17,25,.42);--glass-solid:rgba(16,20,28,.95);
      --fill:rgba(255,255,255,.06);--fill-strong:rgba(255,255,255,.13);
      --stroke:rgba(255,255,255,.09);--hi:rgba(255,255,255,.2);
      --rim:rgba(255,255,255,.5);--rim-soft:rgba(255,255,255,.04);
      --sheen:rgba(255,255,255,.08);
      --shadow:0 32px 90px -24px rgba(0,0,0,.75),0 12px 32px -16px rgba(0,0,0,.55);
      --fg:#f0f6fc;--muted:#adb6c2;--glass-tone:.6;
      --green:#56d364;--blue:#79c0ff;--yellow:#e3b341;--red:#ff7b72;
    }}
    :root[data-theme=dark]{
      --base:#04060c;--blob-1:#2563eb;--blob-2:#8b3cf7;--blob-3:#e0407f;--blob-4:#10b39b;--blob-o:.85;
      --dots:rgba(255,255,255,.11);
      --glass:rgba(13,17,25,.42);--glass-solid:rgba(16,20,28,.95);
      --fill:rgba(255,255,255,.06);--fill-strong:rgba(255,255,255,.13);
      --stroke:rgba(255,255,255,.09);--hi:rgba(255,255,255,.2);
      --rim:rgba(255,255,255,.5);--rim-soft:rgba(255,255,255,.04);
      --sheen:rgba(255,255,255,.08);
      --shadow:0 32px 90px -24px rgba(0,0,0,.75),0 12px 32px -16px rgba(0,0,0,.55);
      --fg:#f0f6fc;--muted:#adb6c2;--glass-tone:.6;
      --green:#56d364;--blue:#79c0ff;--yellow:#e3b341;--red:#ff7b72;
    }

    body{
      font-family:ui-monospace,"SF Mono","Cascadia Code","Segoe UI Mono",Menlo,Monaco,Consolas,monospace;
      background:var(--base);color:var(--fg);
      min-height:100dvh;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      padding:1.5rem 1rem;line-height:1.6;font-size:14px;
      -webkit-font-smoothing:antialiased;
      transition:background .4s,color .4s;
    }

    /* Content layer: the glass needs color and detail behind it. */
    .wallpaper{position:fixed;inset:0;z-index:-1;overflow:hidden;contain:strict;pointer-events:none}
    .wallpaper i{
      position:absolute;width:62vmax;height:62vmax;border-radius:50%;
      opacity:var(--blob-o);will-change:transform;
      animation:drift 40s ease-in-out infinite alternate;
    }
    .wallpaper i:nth-child(1){background:radial-gradient(closest-side,var(--blob-1),transparent);top:-12vmax;left:-6vmax}
    .wallpaper i:nth-child(2){background:radial-gradient(closest-side,var(--blob-2),transparent);top:-8vmax;right:-14vmax;animation-duration:48s;animation-delay:-14s}
    .wallpaper i:nth-child(3){background:radial-gradient(closest-side,var(--blob-3),transparent);bottom:-18vmax;left:4vmax;animation-duration:54s;animation-delay:-28s}
    .wallpaper i:nth-child(4){background:radial-gradient(closest-side,var(--blob-4),transparent);bottom:-12vmax;right:-4vmax;animation-duration:44s;animation-delay:-7s}
    .wallpaper::after{
      content:"";position:absolute;inset:0;
      background:radial-gradient(var(--dots) 1px,transparent 1.5px) 0 0/22px 22px;
      -webkit-mask:radial-gradient(ellipse 75% 65% at 50% 50%,#000 25%,transparent 85%);
      mask:radial-gradient(ellipse 75% 65% at 50% 50%,#000 25%,transparent 85%);
    }
    @keyframes drift{
      0%{transform:translate3d(0,0,0) scale(1)}
      50%{transform:translate3d(9vmax,7vmax,0) scale(1.15)}
      100%{transform:translate3d(-7vmax,11vmax,0) scale(.9)}
    }

    /* Liquid Glass material: translucent tint, saturated blur, specular rim. */
    .glass{
      position:relative;isolation:isolate;
      background:var(--glass);
      -webkit-backdrop-filter:blur(var(--glass-blur,16px)) saturate(var(--glass-sat,1.8)) brightness(var(--glass-tone,1));
      backdrop-filter:blur(var(--glass-blur,16px)) saturate(var(--glass-sat,1.8)) brightness(var(--glass-tone,1));
      box-shadow:inset 0 1px 1px var(--hi),inset 0 -12px 24px -14px var(--sheen),var(--shadow);
      transition:background .4s,box-shadow .4s;
    }
    .glass::before{
      content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
      background:linear-gradient(135deg,var(--rim),var(--rim-soft) 28%,transparent 50%,var(--rim-soft) 72%,var(--rim));
      -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;
    }

    .terminal{
      --glass-blur:14px;
      border-radius:var(--radius);max-width:600px;width:100%;overflow:hidden;
      animation:rise .9s cubic-bezier(.16,1,.3,1) both;
    }
    .terminal::after{
      content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
      background:radial-gradient(360px circle at var(--mx,50%) var(--my,-20%),var(--sheen),transparent 65%);
      opacity:0;transition:opacity .5s;
    }
    .terminal.lit::after{opacity:1}
    @keyframes rise{from{transform:translateY(14px) scale(.975)}}

    .terminal-header{
      padding:.875rem 1rem .25rem;display:flex;align-items:center;gap:.5rem;user-select:none;
    }
    .dots{display:flex;gap:8px}
    .dot{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14)}
    .dot-r{background:var(--dot-red)}
    .dot-y{background:var(--dot-yellow)}
    .dot-g{background:var(--dot-green)}
    .terminal-title{
      flex:1;text-align:center;color:var(--muted);
      font:600 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.01em;
    }
    .theme-btn{
      width:32px;height:32px;border:0;border-radius:50%;cursor:pointer;color:var(--muted);
      display:inline-flex;align-items:center;justify-content:center;
      background:var(--fill);box-shadow:inset 0 1px 0 var(--hi),inset 0 0 0 1px var(--stroke);
      transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .2s,color .2s;
    }
    .theme-btn:hover{background:var(--fill-strong);color:var(--fg);transform:scale(1.08)}
    .theme-btn:active{transform:scale(.92)}
    .theme-btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

    .terminal-body{padding:1.25rem 1.5rem 1.5rem;display:flex;flex-direction:column;gap:1rem}

    .cmd{display:flex;flex-direction:column;gap:.375rem}
    .prompt{color:var(--green);font-weight:600}
    .prompt::before{content:"$ "}
    .out{padding-left:.75rem}
    .dim{color:var(--muted)}
    .err{color:var(--red)}
    .out a{
      color:var(--blue);text-decoration:none;display:inline-block;
      padding:2px 8px;margin:0 -8px;border-radius:999px;
      transition:background .2s,color .2s,box-shadow .2s;
    }
    .out a:hover{color:var(--fg);background:var(--fill-strong);box-shadow:inset 0 1px 0 var(--hi),inset 0 0 0 1px var(--stroke)}
    .out a:focus-visible{outline:2px solid var(--blue);outline-offset:1px}

    .cursor-line .prompt::after{
      content:"";display:inline-block;width:7px;height:1.1em;
      background:var(--green);vertical-align:text-bottom;margin-left:2px;
      animation:blink 1s step-end infinite;
    }
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

    /* Inset capsule, concentric with the window corner. */
    .status-bar{
      margin:0 .75rem .75rem;padding:.3rem .875rem;
      border-radius:calc(var(--radius) - .75rem);
      background:var(--fill);box-shadow:inset 0 1px 0 var(--hi),inset 0 0 0 1px var(--stroke);
      display:flex;justify-content:space-between;
      font-size:12px;color:var(--muted);user-select:none;
    }

    @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
      .glass{background:var(--glass-solid)}
    }
    @media(prefers-reduced-transparency:reduce){
      .glass{background:var(--glass-solid);-webkit-backdrop-filter:none;backdrop-filter:none}
    }
    @media(prefers-contrast:more){
      .glass{background:var(--glass-solid);box-shadow:inset 0 0 0 1px var(--muted),var(--shadow)}
    }
    @media(prefers-reduced-motion:reduce){
      .wallpaper i,.terminal{animation:none}
      .cursor-line .prompt::after{animation:none}
      .theme-btn{transition:none}
    }

    @media(max-width:480px){
      :root{--radius:22px}
      body{padding:.75rem .5rem}
      .terminal-body{padding:1rem .875rem 1.25rem}
    }
  </style>
</head>
<body>
  <div class="wallpaper" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <main class="terminal glass">
    <header class="terminal-header">
      <div class="dots" aria-hidden="true">
        <span class="dot dot-r"></span>
        <span class="dot dot-y"></span>
        <span class="dot dot-g"></span>
      </div>
      <div class="terminal-title">jinsoo@koriel: ~</div>
      <button type="button" class="theme-btn" id="themeToggle" aria-label="Toggle color theme" title="Toggle theme">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </header>

    <div class="terminal-body">
      <div class="cmd">
        <div class="prompt">cat /var/log/error</div>
        <div class="out err">Error 404: page not found</div>
      </div>

      <div class="cmd">
        <div class="prompt">echo $?</div>
        <div class="out dim">The page you're looking for doesn't exist or has been moved.</div>
      </div>

      <div class="cmd">
        <div class="prompt">cd ~</div>
        <div class="out"><a href="/">Back to home</a></div>
      </div>

      <div class="cmd cursor-line">
        <div class="prompt"></div>
      </div>
    </div>

    <footer class="status-bar" aria-hidden="true">
      <span>UTF-8 &middot; Asia/Seoul</span>
      <span id="clock"></span>
    </footer>
  </main>

  <script defer src="/clock.js"></script>
  <script defer src="/theme.js"></script>
  <script defer src="/glass.js"></script>
</body>
</html>

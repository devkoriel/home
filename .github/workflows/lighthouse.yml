name: Lighthouse CI

on:
  pull_request:
    paths:
      - ".github/workflows/lighthouse.yml"
      - ".lighthouserc.cjs"
      - "index.html"
      - "404.html"
      - "clock.js"
      - "theme.js"
      - "main.js"
      - "assets/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/lighthouse.yml"
      - ".lighthouserc.cjs"
      - "index.html"
      - "404.html"
      - "clock.js"
      - "theme.js"
      - "main.js"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.cjs
          uploadArtifacts: true
          temporaryPublicStorage: true

name: Build Resume PDF

on:
  push:
    paths:
      - 'resume.json'
      - 'scripts/build-resume.mjs'
    branches:
      - main
  # Build-only on PRs so puppeteer updates get tested before Renovate merges them.
  pull_request:
    paths:
      - 'resume.json'
      - 'scripts/build-resume.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Build resume PDF
        run: node scripts/build-resume.mjs

      - name: Check PDF was written
        run: test -s resume/resume.pdf

      - name: Commit updated PDF
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume/resume.pdf
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: rebuild resume PDF from resume.json"
            git push
          fi
